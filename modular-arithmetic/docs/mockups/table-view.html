<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rational Explorer – table mockup</title>
<link rel="icon" href="../../../scripts/site-icon.svg" type="image/svg+xml">
<link rel="icon" href="../../../scripts/site-icon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="../../../scripts/site-icon-180.png">
<link rel="stylesheet" href="../../css/style.css">
<style>
  .note { margin-left: auto; font-size: 12px; color: var(--muted); }
  .tabs a { padding: 6px 14px; border-radius: 6px; text-decoration: none; color: var(--muted); }
  .tabs a.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .page.tablePage { grid-template-columns: 270px minmax(0, 1fr); }
  .controls h3 { margin: 14px 0 6px; font-size: 12.5px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); }
  .controls h3:first-child { margin-top: 0; }
  .controls section + section { border-top: 1px solid var(--line); margin-top: 12px; padding-top: 2px; }
  .controls select { width: 100%; padding: 4px; }
  .colsRow { display: flex; align-items: center; gap: 8px; }
  .colsRow input { width: 64px; padding: 4px 6px; text-align: center; }
  .dimRow { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 6px; margin: 6px 0; }
  .seg.small button { padding: 3px 8px; font-size: 13px; }
  .hlKey { margin-top: 8px; display: flex; flex-direction: column; gap: 2px; font-size: 13px; }
  .hlKey .keyItem { justify-content: flex-start; }
  .hlKey .keyItem .cnt { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }
  .hlCount { color: var(--muted); font-size: 12.5px; margin-top: 6px; }
  .hint { color: var(--muted); font-size: 12.5px; margin-top: 12px; }
  .swatch { display: inline-block; width: 14px; height: 14px; border-radius: 50%; flex: 0 0 auto; }
  .tableBox { padding: 12px; }
  .tableBox .tableWrap { max-height: calc(100vh - 110px); }
  .tableStage { position: relative; }
  .band { position: absolute; pointer-events: none; background: rgba(29, 78, 216, .12); display: none; }
  .cellBox { position: absolute; pointer-events: none; outline: 2px solid var(--accent); display: none; border-radius: 4px; }
  .richTip { position: fixed; z-index: 20; pointer-events: none; display: none; background: #1f2430; color: #fff;
    padding: 6px 10px; border-radius: 6px; font-size: 13px; line-height: 1.4; max-width: 280px; box-shadow: 0 2px 8px rgba(0,0,0,.2); }
  .richTip b { font-size: 15px; }
  .richTip .muted { color: #b9c0cf; }
  .inert { opacity: .55; }
</style>
</head>
<body>
<header class="appHeader">
  <h1>Rational Explorer</h1>
  <nav class="tabs">
    <a href="single-view.html">Graph N:M</a>
    <a class="active" href="#">Table n:m</a>
  </nav>
  <span class="note">mockup – not wired to the app</span>
</header>

<main class="page tablePage">
  <aside class="panel controls" id="controls"></aside>
  <section class="panel tableBox">
    <div class="tableWrap" id="wrap">
      <div class="tableStage" id="stage">
        <canvas class="tableCanvas" id="canvas"></canvas>
        <div class="band" id="colBand"></div>
        <div class="band" id="rowBand"></div>
        <div class="cellBox" id="cellBox"></div>
      </div>
    </div>
  </section>
</main>
<div class="richTip" id="tip"></div>

<script src="../../js/core/numberTheory.js"></script>
<script src="../../js/core/constants.js"></script>
<script src="../../js/core/multiplicationGraph.js"></script>
<script src="../../js/core/analysis.js"></script>
<script src="../../js/core/lengthFilter.js"></script>
<script src="../../js/core/geometry.js"></script>
<script src="../../js/core/cellClassification.js"></script>
<script src="../../js/ui/dom.js"></script>
<script src="../../js/ui/drawCell.js"></script>
<script src="../../js/ui/cellCache.js"></script>
<script>
(function () {
  'use strict'
  const { COLORS, INTERVALS, cellOpacity, matchesHighlight } = Ratios.core
  const { el, drawCell, createCellCache } = Ratios.ui

  const CELL = 120, LABEL = 34
  const cache = createCellCache()
  const state = {
    cols: 12, showNGreaterM: true, display: 'graph', cycles: false,
    highlight: 'none', coprime: 'show', coprimeShifted: 'show', zoom: 'width'
  }
  let keyFocus = null // Wert aus der Zeichenerklärung, auf den die Hervorhebung beschränkt ist
  let zoom = 1

  const HIGHLIGHTS = [
    ['none', 'none'], ['gcd', 'gcd(n, m)'], ['gcdShifted', 'gcd(n − 1, m) · rotational symmetry'],
    ['primitiveRoot', 'n is a primitive root mod m'], ['interval', 'musical intervals'],
    ['constructible', 'm-gon constructible'],
    ['cycle2', 'has 2-cycles'], ['cycle3', 'has 3-cycles'], ['cycle4', 'has 4-cycles'],
    ['cycle5', 'has 5-cycles'], ['cycle6', 'has 6-cycles'], ['cycle7', 'has 7-cycles']
  ]
  const color = i => COLORS[i % COLORS.length]

  // ---------- Zellen ----------
  function cells() {
    const out = []
    for (let n = 1; n <= state.cols; n++) {
      for (let m = 2; m <= state.cols; m++) {
        if (n === m) continue
        if (!state.showNGreaterM && n > m) continue
        out.push({ n, m, x: LABEL + (m - 2) * CELL, y: LABEL + (n - 1) * CELL })
      }
    }
    return out
  }
  const size = () => ({ w: LABEL + (state.cols - 1) * CELL + 8, h: LABEL + state.cols * CELL + 8 })

  // Wert einer Zelle für die Zeichenerklärung (null = nicht hervorgehoben)
  function keyValue(cls) {
    switch (state.highlight) {
      case 'gcd': return cls.gcd > 1 ? cls.gcd : null
      case 'gcdShifted': return cls.gcdShifted > 1 ? cls.gcdShifted : null
      case 'interval': return cls.intervalIndex
      default: return matchesHighlight(cls, state.highlight) ? 'yes' : null
    }
  }
  function keyEntries(list) {
    const counts = new Map()
    for (const c of list) {
      const v = keyValue(cache.get(c.n, c.m, state.cycles).cls)
      if (v !== null) counts.set(v, (counts.get(v) || 0) + 1)
    }
    const entries = [...counts].map(([v, count]) => {
      if (state.highlight === 'gcd') return { v, count, label: `gcd = ${v}`, swatch: color(v - 1), sort: v }
      if (state.highlight === 'gcdShifted') return { v, count, label: `gcd(n − 1, m) = ${v}`, swatch: color(v - 1), sort: v }
      if (state.highlight === 'interval') return { v, count, label: INTERVALS[v].name, swatch: color(v), sort: v }
      return { v, count, label: HIGHLIGHTS.find(h => h[0] === state.highlight)[1], swatch: null, sort: 0 }
    })
    return entries.sort((a, b) => a.sort - b.sort)
  }

  // ---------- Zeichnen ----------
  const canvas = document.getElementById('canvas')
  const wrap = document.getElementById('wrap')

  function computeZoom() {
    const { w, h } = size()
    if (state.zoom === 'width') return Math.min(1.5, (wrap.clientWidth - 2) / w)
    if (state.zoom === 'height') return Math.min(1.5, (window.innerHeight - 110 - 2) / h)
    return 1
  }

  function draw() {
    const { w, h } = size()
    zoom = computeZoom()
    const dpr = window.devicePixelRatio || 1
    const scale = Math.min(zoom * dpr, 16000 / Math.max(w, h))
    canvas.style.width = `${w * zoom}px`
    canvas.style.height = `${h * zoom}px`
    canvas.width = Math.ceil(w * scale)
    canvas.height = Math.ceil(h * scale)
    // Erscheint erst durch die neue Höhe eine senkrechte Bildlaufleiste, ist die Breite kleiner als angenommen.
    if (state.zoom === 'width' && wrap.scrollWidth > wrap.clientWidth + 1) { draw(); return }
    const ctx = canvas.getContext('2d')
    ctx.setTransform(scale, 0, 0, scale, 0, 0)
    ctx.clearRect(0, 0, w, h)

    // Beschriftung: m oben, n links
    ctx.fillStyle = '#6b6b6b'
    ctx.font = '600 18px system-ui, "Segoe UI", Roboto, Arial, sans-serif'
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'
    for (let m = 2; m <= state.cols; m++) ctx.fillText(String(m), LABEL + (m - 1.5) * CELL, LABEL / 2)
    for (let n = 1; n <= state.cols; n++) ctx.fillText(String(n), LABEL / 2, LABEL + (n - 0.5) * CELL)
    ctx.font = 'italic 16px Georgia, serif'
    ctx.fillText('n \\ m', LABEL / 2 + 2, LABEL / 2)

    for (const c of cells()) {
      const entry = cache.get(c.n, c.m, state.cycles)
      let opacity = cellOpacity(entry.cls, state)
      if (keyFocus !== null && keyValue(entry.cls) !== keyFocus) opacity = Math.min(opacity, 0.12)
      drawCell(ctx, { ...c, ...entry }, { display: state.display, highlight: state.highlight, opacity, size: CELL, pieColor: COLORS[2] })
    }
  }

  // ---------- Bedienspalte ----------
  function seg(options, current, onPick, cls = '') {
    return el('div', { class: `seg ${cls}` }, options.map(([v, t]) =>
      el('button', { type: 'button', class: v === current ? 'on' : '', onclick: () => onPick(v) }, t)))
  }
  function set(patch) { Object.assign(state, patch); keyFocus = null; render() }

  function renderControls() {
    const list = cells()
    const entries = state.highlight === 'none' ? [] : keyEntries(list)
    const matching = entries.reduce((s, e) => s + e.count, 0)
    const controls = document.getElementById('controls')
    controls.replaceChildren(
      el('section', {}, [
        el('h3', {}, 'Size'),
        el('div', { class: 'colsRow' }, [
          el('button', { class: 'step', type: 'button', onclick: () => set({ cols: Math.max(3, state.cols - 1) }) }, '‹'),
          el('input', { type: 'number', min: 3, max: 60, value: state.cols, onchange: ev => set({ cols: Math.min(60, Math.max(3, +ev.target.value || 12)) }) }),
          el('button', { class: 'step', type: 'button', onclick: () => set({ cols: Math.min(60, state.cols + 1) }) }, '›'),
          el('span', { class: 'inlineLabel' }, 'm up to')
        ]),
        el('label', { class: 'opt' }, [
          el('input', { type: 'checkbox', checked: state.showNGreaterM, onchange: ev => set({ showNGreaterM: ev.target.checked }) }),
          'also n > m (below the diagonal)'
        ]),
        el('div', { class: 'opt' }, [el('span', { class: 'inlineLabel' }, 'zoom'),
          seg([['width', 'fit width'], ['height', 'fit height'], ['100', '100 %']], state.zoom, v => set({ zoom: v }), 'small')])
      ]),
      el('section', {}, [
        el('h3', {}, 'Show'),
        seg([['graph', 'graph'], ['numbers', 'numbers'], ['pie', 'pie']], state.display, v => set({ display: v })),
        el('label', { class: 'opt' + (state.display === 'graph' ? '' : ' disabled') }, [
          el('input', { type: 'checkbox', checked: state.cycles, disabled: state.display !== 'graph', onchange: ev => set({ cycles: ev.target.checked }) }),
          'cycles in colour'
        ])
      ]),
      el('section', {}, [
        el('h3', {}, 'Highlight'),
        el('select', { onchange: ev => set({ highlight: ev.target.value }) },
          HIGHLIGHTS.map(([v, t]) => el('option', { value: v, selected: v === state.highlight }, t))),
        state.highlight === 'none' ? null : el('div', { class: 'hlCount' }, `${matching} of ${list.length} cells`),
        entries.length > 1 || (entries.length === 1 && entries[0].swatch)
          ? el('div', { class: 'hlKey' }, entries.map(e => el('span', {
              class: 'keyItem',
              onmouseenter: () => { keyFocus = e.v; draw() },
              onmouseleave: () => { keyFocus = null; draw() }
            }, [e.swatch ? el('span', { class: 'swatch', style: `background:${e.swatch}` }) : null, e.label, el('span', { class: 'cnt' }, e.count)])))
          : null
      ]),
      el('section', {}, [
        el('h3', {}, 'Dim cells'),
        el('div', { class: 'dimRow' }, [el('span', {}, 'gcd(n, m) = 1'),
          seg([['show', 'off'], ['hide', 'these'], ['only', 'the others']], state.coprime, v => set({ coprime: v }), 'small')]),
        el('div', { class: 'dimRow' }, [el('span', {}, 'gcd(n − 1, m) = 1'),
          seg([['show', 'off'], ['hide', 'these'], ['only', 'the others']], state.coprimeShifted, v => set({ coprimeShifted: v }), 'small')])
      ]),
      el('p', { class: 'hint' }, 'Hover a cell for details. Click a cell to open it as graph N:M.')
    )
  }

  function render() { renderControls(); draw() }

  // ---------- Zeiger ----------
  const tip = document.getElementById('tip')
  const colBand = document.getElementById('colBand'), rowBand = document.getElementById('rowBand'), cellBox = document.getElementById('cellBox')
  function hit(ev) {
    const r = canvas.getBoundingClientRect()
    const x = (ev.clientX - r.left) / zoom - LABEL, y = (ev.clientY - r.top) / zoom - LABEL
    if (x < 0 || y < 0) return null
    const m = Math.floor(x / CELL) + 2, n = Math.floor(y / CELL) + 1
    if (m > state.cols || n > state.cols || n === m || (!state.showNGreaterM && n > m)) return null
    return { n, m }
  }
  function place(node, x, y, w, h) {
    Object.assign(node.style, { display: 'block', left: `${x * zoom}px`, top: `${y * zoom}px`, width: `${w * zoom}px`, height: `${h * zoom}px` })
  }
  function hide() { for (const node of [tip, colBand, rowBand, cellBox]) node.style.display = 'none' }

  function tipHtml(n, m) {
    const { graph, cls } = cache.get(n, m, state.cycles)
    const perm = cls.coprime
    const cyc = graph.cycles.length
    const rows = [
      `<b>${n} : ${m}</b> &nbsp;<span class="muted">a ↦ ${n % m}·a mod ${m}</span>`,
      perm ? `permutation · ${cyc} cycle${cyc === 1 ? '' : 's'}` : `not a permutation · ${graph.imagePoints.length} of ${m} residues hit`,
      `gcd(n, m) = ${cls.gcd} · gcd(n − 1, m) = ${cls.gcdShifted}`
    ]
    if (cls.primitiveRoot) rows.push(`${n % m} is a primitive root mod ${m}`)
    if (cls.interval) rows.push(`interval: ${cls.interval}`)
    rows.push('<span class="muted">click to open</span>')
    return rows.join('<br>')
  }

  canvas.addEventListener('pointermove', ev => {
    const c = hit(ev)
    if (!c) { hide(); canvas.style.cursor = 'default'; return }
    canvas.style.cursor = 'pointer'
    const x = LABEL + (c.m - 2) * CELL, y = LABEL + (c.n - 1) * CELL
    place(colBand, x, 0, CELL, LABEL)
    place(rowBand, 0, y, LABEL, CELL)
    place(cellBox, x + 2, y + 2, CELL - 4, CELL - 4)
    tip.innerHTML = tipHtml(c.n, c.m)
    tip.style.display = 'block'
    const left = Math.min(ev.clientX + 16, window.innerWidth - tip.offsetWidth - 8)
    const top = ev.clientY + 18 + tip.offsetHeight > window.innerHeight ? ev.clientY - tip.offsetHeight - 12 : ev.clientY + 18
    tip.style.left = `${left}px`; tip.style.top = `${top}px`
  })
  canvas.addEventListener('pointerleave', hide)
  canvas.addEventListener('click', ev => {
    const c = hit(ev)
    if (c) window.location.href = `../../index.html?MODE=1&N=${c.n}&M=${c.m}`
  })
  window.addEventListener('resize', draw)

  render()
})()
</script>
</body>
</html>
